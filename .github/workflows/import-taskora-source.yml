name: Import complete Taskora source bundle

on:
  push:
    branches: [main]
    paths:
      - ".taskora-import/**"
      - ".github/workflows/import-taskora-source.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: taskora-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Loofy147/Taskora'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Reconstruct and safely extract source
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          test -d .taskora-import
          mapfile -t chunks < <(find .taskora-import -maxdepth 1 -type f -name 'chunk-*.b64' -printf '%f\\n' | sort)
          test "${#chunks[@]}" -eq 61
          for i in $(seq 0 60); do
            printf -v expected 'chunk-%03d.b64' "$i"
            printf '%s\\n' "${chunks[@]}" | grep -Fxq "$expected"
          done
          : > /tmp/taskora-source.b64
          for chunk in "${chunks[@]}"; do cat ".taskora-import/$chunk" >> /tmp/taskora-source.b64; done
          base64 --decode /tmp/taskora-source.b64 > /tmp/taskora-source.zip
          echo "c759845b23aa68e9d98287d276e9b75ee0eba681d725d3f32bcd8cba1a12124e  /tmp/taskora-source.zip" | sha256sum --check
          python3 - <<'PY'
          import shutil, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("/tmp/taskora-source.zip")
          root = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as zf:
              if zf.testzip() is not None:
                  raise SystemExit("ZIP integrity check failed")
              files = [entry for entry in zf.infolist() if not entry.is_dir()]
              if len(files) != 154:
                  raise SystemExit(f"Unexpected source file count: {len(files)}")
              for entry in files:
                  rel = PurePosixPath(entry.filename)
                  mode = entry.external_attr >> 16
                  if rel.is_absolute() or not rel.parts or any(part in ("", ".", "..") for part in rel.parts):
                      raise SystemExit(f"Unsafe archive path: {entry.filename!r}")
                  if ".git" in rel.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Forbidden archive entry: {entry.filename!r}")
                  target = root.joinpath(*rel.parts)
                  if target.resolve() != root and root not in target.resolve().parents:
                      raise SystemExit(f"Archive path escapes repository: {entry.filename!r}")
              written = 0
              for entry in files:
                  target = root.joinpath(*PurePosixPath(entry.filename).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(entry) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
                  written += 1
          print(f"Validated and extracted {written} source files.")
          PY
          rm -rf .taskora-import
          rm -f .github/workflows/import-taskora-source.yml

      - name: Set up Node.js
        id: node
        if: steps.restore.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: install
        if: steps.restore.outcome == 'success' && steps.node.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Run automated tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: TypeScript check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Production build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Commit complete application source
        id: commit
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import complete Taskora application source"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch repository CI against the imported commit
        if: steps.commit.outcome == 'success' && steps.commit.outputs.commit_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}'
